{% extends "base.html" %}
{% block title %}Add Income — Nexora{% endblock %}
{% block page_title %}New Deposit / Income{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card-glass">
      <div class="card-glass-header">
        <span class="material-icons text-success">add_circle</span>
        <h5>Deposit Funds / Record Income</h5>
      </div>

      <form method="POST" action="{{ url_for('income.add') }}">
        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label">Amount <span class="text-danger">*</span></label>
              <div class="input-icon-wrap">
                <span class="input-currency">{{ current_user.currency }}</span>
                <input type="number" name="amount" class="form-control ps-5" step="0.01" min="0.01"
                       placeholder="0.00" required/>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label">Date <span class="text-danger">*</span></label>
              <input type="date" name="date" class="form-control" value="{{ today }}" required/>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Income Source <span class="text-danger">*</span></label>
          <select name="source" class="form-select" required>
            {% for s in sources %}
              <option value="{{ s }}">{{ s }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Description <small class="text-muted">(Optional)</small></label>
          <input type="text" name="description" class="form-control" placeholder="e.g. Monthly salary, Crypto staking reward, Consulting…"/>
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-success">
            <span class="material-icons">save</span>Save Income
          </button>
          <a href="{{ url_for('income.index') }}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
