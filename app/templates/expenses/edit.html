{% extends "base.html" %}
{% block title %}Edit Expense — Nexora{% endblock %}
{% block page_title %}Edit Expense{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card-glass">
      <div class="card-glass-header">
        <span class="material-icons text-accent">edit_note</span>
        <h5>Edit Transaction #{{ expense.id }}</h5>
      </div>

      <form method="POST" action="{{ url_for('expenses.edit', expense_id=expense.id) }}">
        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label">Amount <span class="text-danger">*</span></label>
              <div class="input-icon-wrap">
                <span class="input-currency">{{ current_user.currency }}</span>
                <input type="number" name="amount" class="form-control ps-5" step="0.01" min="0.01"
                       value="{{ expense.amount }}" required/>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label">Date <span class="text-danger">*</span></label>
              <input type="date" name="date" class="form-control" value="{{ expense.date.strftime('%Y-%m-%d') }}" required/>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Description <span class="text-danger">*</span></label>
          <input type="text" name="description" class="form-control" value="{{ expense.description }}" required/>
        </div>

        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label">Category <span class="text-danger">*</span></label>
              <select name="category" class="form-select" required>
                {% for c in categories %}
                  <option value="{{ c }}" {% if c == expense.category %}selected{% endif %}>{{ c }}</option>
                {% endfor %}
              </select>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label">Payment Method</label>
              <select name="payment_method" class="form-select">
                {% for m in payment_methods %}
                  <option value="{{ m }}" {% if m == expense.payment_method %}selected{% endif %}>{{ m }}</option>
                {% endfor %}
              </select>
            </div>
          </div>
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary">
            <span class="material-icons">save</span>Update Changes
          </button>
          <a href="{{ url_for('expenses.index') }}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
